name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build & Install Dependencies
      run: mvn install -DskipTests

    - name: Install Playwright Browsers
      run: mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps"

    - name: Run Tests
      run: mvn test

    - name: Get Allure History
      if: always()
      run: |
        mkdir -p gh-pages
        if git ls-remote --exit-code --heads origin gh-pages; then
          echo "Found gh-pages branch"
          git fetch --depth=1 origin gh-pages
          git --work-tree=gh-pages checkout -f origin/gh-pages -- .
        else
          echo "gh-pages branch not found, skipping history"
        fi

    - name: Allure Report
      uses: simple-elf/allure-report-action@master
      if: always()
      id: allure-report
      with:
        allure_results: target/allure-results
        gh_pages: gh-pages
        allure_report: allure-report
        allure_history: allure-history

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          target/surefire-reports
          target/allure-results
